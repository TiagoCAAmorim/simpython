[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimpy"
version = "0.1.0"
description = "Tools to read and plot reservoir simulation (CMG) data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tiago Amorim", email = "tiago.ca.amorim@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
    "h5py>=3.13.0",
    "scipy>=1.15.2",
    "xarray>=2025.1.2",
    "bokeh>=3.0.0",
    "plotly>=5.24.0",
    "dash>=2.18.0",
]

[project.optional-dependencies]
dashboard = ["kaleido>=1.1", "diskcache>=5.6", "pillow>=10.0"]
template = ["pyDOE>=0.3.8,<1.0"]  # pyDOE 1.x renamed the module to "pydoe"
test = ["pytest"]
all = ["rsimpy[dashboard,template,test]"]

[tool.setuptools.packages.find]
include = ["rsimpy*"]
